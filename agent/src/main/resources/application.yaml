server:
  port: ${AGENT_PORT:8082}
  address: ${AGENT_BIND_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: credit-agent
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
