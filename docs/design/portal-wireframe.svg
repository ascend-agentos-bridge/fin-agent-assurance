<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-label="Agent Assurance Portal"><style>text{font-family:Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}</style><rect x="0" y="0" width="1440" height="920" rx="0" fill="#f5f6f8" stroke="#f5f6f8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#202124" stroke="#202124"/><rect x="24" y="20" width="5" height="24" rx="0" fill="#c7000b" stroke="#c7000b"/><text x="44" y="42" font-size="20" fill="white" font-weight="600">Agent Assurance Portal</text><text x="1090" y="40" font-size="14" fill="#e3e6e9" font-weight="400">设计示意 · 非运行数据</text><text x="32" y="112" font-size="16" fill="#687078" font-weight="400">单个银行信贷智能体 / 质量保障旅程</text><text x="32" y="158" font-size="30" fill="#202124" font-weight="600">从测试评估到运行观测</text><text x="32" y="190" font-size="16" fill="#687078" font-weight="400">沿生命周期进入对应保障工具，业务办理请打开独立信贷工作台。</text><rect x="1140" y="118" width="268" height="48" rx="8" fill="#c7000b" stroke="#c7000b"/><text x="1165" y="149" font-size="18" fill="white" font-weight="600">打开信贷工作台  ↗</text><rect x="32" y="230" width="256" height="132" rx="8" fill="#eceef1" stroke="#dce0e5"/><text x="50" y="259" font-size="14" fill="#687078" font-weight="600">01</text><text x="50" y="293" font-size="18" fill="#687078" font-weight="600">设计与开发</text><text x="50" y="328" font-size="14" fill="#687078" font-weight="400">规划中 · 暂未开放</text><rect x="312" y="230" width="256" height="132" rx="8" fill="white" stroke="#c7000b"/><text x="330" y="259" font-size="14" fill="#c7000b" font-weight="600">02</text><text x="330" y="293" font-size="18" fill="#202124" font-weight="600">测试与评估</text><text x="330" y="328" font-size="14" fill="#c7000b" font-weight="400">本轮支持</text><rect x="592" y="230" width="256" height="132" rx="8" fill="#eceef1" stroke="#dce0e5"/><text x="610" y="259" font-size="14" fill="#687078" font-weight="600">03</text><text x="610" y="293" font-size="18" fill="#687078" font-weight="600">部署与发布</text><text x="610" y="328" font-size="14" fill="#687078" font-weight="400">规划中 · 暂未开放</text><rect x="872" y="230" width="256" height="132" rx="8" fill="white" stroke="#c7000b"/><text x="890" y="259" font-size="14" fill="#c7000b" font-weight="600">04</text><text x="890" y="293" font-size="18" fill="#202124" font-weight="600">运行与观测</text><text x="890" y="328" font-size="14" fill="#c7000b" font-weight="400">本轮支持</text><rect x="1152" y="230" width="256" height="132" rx="8" fill="#eceef1" stroke="#dce0e5"/><text x="1170" y="259" font-size="14" fill="#687078" font-weight="600">05</text><text x="1170" y="293" font-size="18" fill="#687078" font-weight="600">风险处置与持续改进</text><text x="1170" y="328" font-size="14" fill="#687078" font-weight="400">规划中 · 暂未开放</text><text x="32" y="413" font-size="22" fill="#202124" font-weight="600">当前保障入口</text><text x="970" y="412" font-size="14" fill="#687078" font-weight="400">能力支持 ≠ 服务当前健康</text><rect x="32" y="440" width="672" height="148" rx="8" fill="white" stroke="#dce0e5"/><text x="54" y="476" font-size="20" fill="#202124" font-weight="600">执行追踪</text><text x="54" y="508" font-size="16" fill="#687078" font-weight="400">在 Langfuse 查看本项目真实 Trace</text><text x="54" y="555" font-size="16" fill="#c7000b" font-weight="600">打开 Trace 列表  ↗</text><text x="522" y="474" font-size="14" fill="#687078" font-weight="400">状态：尚未检查</text><rect x="736" y="440" width="672" height="148" rx="8" fill="white" stroke="#dce0e5"/><text x="758" y="476" font-size="20" fill="#202124" font-weight="600">数据集与评测</text><text x="758" y="508" font-size="16" fill="#687078" font-weight="400">在 Langfuse 查看数据集、实验及评分</text><text x="758" y="555" font-size="16" fill="#c7000b" font-weight="600">打开数据集 / 实验  ↗</text><text x="1226" y="474" font-size="14" fill="#687078" font-weight="400">状态：尚未检查</text><rect x="32" y="612" width="672" height="148" rx="8" fill="white" stroke="#dce0e5"/><text x="54" y="648" font-size="20" fill="#202124" font-weight="600">运行指标</text><text x="54" y="680" font-size="16" fill="#687078" font-weight="400">在 Grafana 查看预置运行仪表盘</text><text x="54" y="727" font-size="16" fill="#c7000b" font-weight="600">打开 Grafana 仪表盘  ↗</text><text x="522" y="646" font-size="14" fill="#687078" font-weight="400">状态：尚未检查</text><rect x="736" y="612" width="672" height="148" rx="8" fill="white" stroke="#dce0e5"/><text x="758" y="648" font-size="20" fill="#202124" font-weight="600">运行告警</text><text x="758" y="680" font-size="16" fill="#687078" font-weight="400">在 Grafana 配置规则及 Contact points</text><text x="758" y="727" font-size="16" fill="#c7000b" font-weight="600">告警规则  ↗    Contact points  ↗</text><text x="1226" y="646" font-size="14" fill="#687078" font-weight="400">状态：尚未检查</text><rect x="32" y="807" width="1376" height="48" rx="8" fill="#fff7f7" stroke="#efd1d3"/><text x="50" y="838" font-size="15" fill="#687078" font-weight="400">地址设置仅保存服务地址、项目与仪表盘标识；原生工具在新标签页打开。</text><text x="32" y="893" font-size="14" fill="#687078" font-weight="400">UCD 设计稿｜所有状态为界面示意，不代表后端已实现或服务已验证。</text></svg>