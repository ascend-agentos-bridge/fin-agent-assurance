<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-label="信贷智能体工作台"><style>text{font-family:Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}</style><rect x="0" y="0" width="1440" height="920" rx="0" fill="#f5f6f8" stroke="#f5f6f8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#202124" stroke="#202124"/><rect x="24" y="20" width="5" height="24" rx="0" fill="#c7000b" stroke="#c7000b"/><text x="44" y="42" font-size="20" fill="white" font-weight="600">信贷智能体工作台</text><text x="1090" y="40" font-size="14" fill="#e3e6e9" font-weight="400">设计示意 · 非运行数据</text><rect x="0" y="64" width="224" height="800" rx="0" fill="white" stroke="#dce0e5"/><text x="24" y="110" font-size="16" fill="#687078" font-weight="400">信贷分析</text><rect x="12" y="118" width="200" height="48" rx="6" fill="#fff0f1" stroke="#fff0f1"/><text x="28" y="149" font-size="17" fill="#c7000b" font-weight="600">对话</text><text x="28" y="213" font-size="17" fill="#202124" font-weight="400">Skills 能力库</text><text x="28" y="277" font-size="17" fill="#202124" font-weight="400">模型服务</text><text x="28" y="341" font-size="17" fill="#202124" font-weight="400">Mock 银行</text><text x="256" y="110" font-size="28" fill="#202124" font-weight="600">对话</text><text x="256" y="145" font-size="16" fill="#687078" font-weight="400">仅提供辅助分析，不执行真实审批或放款。</text><rect x="256" y="172" width="1152" height="66" rx="8" fill="#fff8e8" stroke="#e8d5a9"/><text x="278" y="199" font-size="17" fill="#202124" font-weight="600">尚未配置模型服务</text><text x="278" y="223" font-size="15" fill="#687078" font-weight="400">请在“模型服务”保存真实服务配置并进行能力测试，再发起信贷分析。</text><rect x="256" y="262" width="746" height="542" rx="8" fill="white" stroke="#dce0e5"/><text x="280" y="298" font-size="20" fill="#202124" font-weight="600">新对话</text><text x="280" y="330" font-size="15" fill="#687078" font-weight="400">案例：材料齐全（合成 Mock 案例）</text><text x="365" y="468" font-size="22" fill="#202124" font-weight="600">配置模型后开始实际分析</text><text x="340" y="507" font-size="15" fill="#687078" font-weight="400">运行后展示建议、依据、缺失材料与人工处理原因。</text><rect x="280" y="647" width="698" height="82" rx="8" fill="#f5f6f8" stroke="#dce0e5"/><text x="298" y="677" font-size="16" fill="#687078" font-weight="400">输入信贷分析任务……</text><rect x="790" y="745" width="188" height="40" rx="8" fill="#e6e8eb" stroke="#e6e8eb"/><text x="825" y="771" font-size="16" fill="#687078" font-weight="400">发送（待配置）</text><rect x="1026" y="262" width="382" height="542" rx="8" fill="white" stroke="#dce0e5"/><text x="1050" y="299" font-size="20" fill="#202124" font-weight="600">本轮执行事实</text><text x="1050" y="339" font-size="16" fill="#687078" font-weight="400">运行状态：尚未开始</text><text x="1050" y="379" font-size="16" fill="#687078" font-weight="400">模型配置：未绑定</text><text x="1050" y="419" font-size="16" fill="#687078" font-weight="400">Skill 事件：暂无</text><text x="1050" y="459" font-size="16" fill="#687078" font-weight="400">工具调用：暂无</text><text x="1050" y="499" font-size="16" fill="#687078" font-weight="400">Mock 来源：未读取</text><text x="1050" y="539" font-size="16" fill="#687078" font-weight="400">错误：暂无运行</text><text x="1050" y="600" font-size="15" fill="#687078" font-weight="400">执行后提供对应 Trace 入口</text><text x="1050" y="638" font-size="15" fill="#687078" font-weight="400">断流不等于执行失败；</text><text x="1050" y="663" font-size="15" fill="#687078" font-weight="400">先查询服务端运行终态。</text><text x="256" y="846" font-size="15" fill="#687078" font-weight="400">发送中禁用重复提交；重连查询既有 runId，不重新发起 Agent。</text><text x="32" y="893" font-size="14" fill="#687078" font-weight="400">UCD 设计稿｜所有状态为界面示意，不代表后端已实现或服务已验证。</text></svg>