<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-label="信贷智能体工作台 · 模型服务"><style>text{font-family:Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}</style><rect x="0" y="0" width="1440" height="920" rx="0" fill="#f5f6f8" stroke="#f5f6f8"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#202124" stroke="#202124"/><rect x="24" y="20" width="5" height="24" rx="0" fill="#c7000b" stroke="#c7000b"/><text x="44" y="42" font-size="20" fill="white" font-weight="600">信贷智能体工作台 · 模型服务</text><text x="1090" y="40" font-size="14" fill="#e3e6e9" font-weight="400">设计示意 · 非运行数据</text><rect x="0" y="64" width="224" height="800" rx="0" fill="white" stroke="#dce0e5"/><text x="28" y="156" font-size="17" fill="#202124" font-weight="400">对话</text><text x="28" y="220" font-size="17" fill="#202124" font-weight="400">Skills 能力库</text><rect x="12" y="253" width="200" height="48" rx="6" fill="#fff0f1" stroke="#fff0f1"/><text x="28" y="284" font-size="17" fill="#c7000b" font-weight="600">模型服务</text><text x="28" y="348" font-size="17" fill="#202124" font-weight="400">Mock 银行</text><text x="256" y="116" font-size="28" fill="#202124" font-weight="600">模型服务</text><text x="256" y="151" font-size="16" fill="#687078" font-weight="400">配置仅应用于新对话；已有对话保留配置快照。</text><rect x="256" y="183" width="742" height="634" rx="8" fill="white" stroke="#dce0e5"/><text x="280" y="220" font-size="21" fill="#202124" font-weight="600">连接配置</text><text x="280" y="264" font-size="15" fill="#202124" font-weight="600">协议 / Provider</text><rect x="280" y="276" width="694" height="44" rx="8" fill="#f5f6f8" stroke="#dce0e5"/><text x="294" y="304" font-size="15" fill="#687078" font-weight="400">OpenAI-compatible（待 Java Core 协议验证）</text><text x="280" y="358" font-size="15" fill="#202124" font-weight="600">Base URL</text><rect x="280" y="370" width="694" height="44" rx="8" fill="#f5f6f8" stroke="#dce0e5"/><text x="294" y="398" font-size="15" fill="#687078" font-weight="400">https://your-model-service.example/v1</text><text x="280" y="452" font-size="15" fill="#202124" font-weight="600">模型 ID</text><rect x="280" y="464" width="694" height="44" rx="8" fill="#f5f6f8" stroke="#dce0e5"/><text x="294" y="492" font-size="15" fill="#687078" font-weight="400">输入实际模型标识</text><text x="280" y="546" font-size="15" fill="#202124" font-weight="600">API Key</text><rect x="280" y="558" width="694" height="44" rx="8" fill="#f5f6f8" stroke="#dce0e5"/><text x="294" y="586" font-size="15" fill="#687078" font-weight="400">输入新密钥；保存后不回显原值</text><text x="280" y="640" font-size="15" fill="#202124" font-weight="600">参数</text><rect x="280" y="652" width="694" height="44" rx="8" fill="#f5f6f8" stroke="#dce0e5"/><text x="294" y="680" font-size="15" fill="#687078" font-weight="400">Temperature 0.2 / 最大输出 2048 / 超时 60s</text><rect x="280" y="754" width="144" height="40" rx="8" fill="#c7000b" stroke="#c7000b"/><text x="313" y="780" font-size="16" fill="white" font-weight="600">保存配置</text><rect x="448" y="754" width="220" height="40" rx="8" fill="white" stroke="#dce0e5"/><text x="473" y="780" font-size="16" fill="#c7000b" font-weight="600">测试实际能力</text><rect x="1022" y="183" width="386" height="634" rx="8" fill="white" stroke="#dce0e5"/><text x="1046" y="220" font-size="21" fill="#202124" font-weight="600">能力测试</text><text x="1046" y="263" font-size="17" fill="#687078" font-weight="400">文本生成       未测试</text><text x="1046" y="311" font-size="17" fill="#687078" font-weight="400">工具调用       未测试</text><text x="1046" y="359" font-size="17" fill="#687078" font-weight="400">流式输出       未测试</text><rect x="1046" y="405" width="338" height="130" rx="8" fill="#fff8e8" stroke="#e8d5a9"/><text x="1062" y="434" font-size="14" fill="#202124" font-weight="600">测试会调用真实模型，可能产生费用。</text><text x="1062" y="469" font-size="14" fill="#687078" font-weight="400">点击测试前说明调用内容和次数。</text><text x="1062" y="499" font-size="14" fill="#687078" font-weight="400">逐项记录通过、失败或不支持。</text><text x="1046" y="580" font-size="15" fill="#687078" font-weight="400">密钥由后端保管；</text><text x="1046" y="609" font-size="15" fill="#687078" font-weight="400">不进入浏览器持久存储、日志或 Trace。</text><text x="1046" y="664" font-size="15" fill="#687078" font-weight="400">无模型时允许平台启动；</text><text x="1046" y="693" font-size="15" fill="#687078" font-weight="400">对话不回退到固定答案或 Mock 模型。</text><text x="32" y="893" font-size="14" fill="#687078" font-weight="400">UCD 设计稿｜所有状态为界面示意，不代表后端已实现或服务已验证。</text></svg>